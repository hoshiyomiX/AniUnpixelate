name: Build APK

# Builds the Android APK on every push and pull request.
# Debug APK  -> installable directly.
# Release APK -> unsigned; sign it before distribution (see README).
# Every successful build is published to GitHub Releases:
#   - branch pushes & manual runs -> rolling "nightly" pre-release (replaced on each build)
#   - tag pushes (v*)             -> a Release named after the tag
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug & release APK
    runs-on: ubuntu-latest
    # Required to create GitHub Releases and upload assets via gh.
    # Without this, the default read-only GITHUB_TOKEN gets a 403 on release creation.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch ONNX model (Apache-2.0, big-lama)
        # The model is fetched at build time instead of living in git (208 MB
        # binary). Pinned URL + SHA256; swap the pin to upgrade the model.
        # No app-side change is needed when swapping: the app extracts the
        # asset into filesDir stamped with the package lastUpdateTime, so
        # installing an updated APK always re-extracts and never serves a
        # stale cached model.
        env:
          MODEL_URL: https://huggingface.co/gumka/lama-onnx/resolve/main/lama_fp32.onnx
          MODEL_SHA256: 1faef5301d78db7dda502fe59966957ec4b79dd64e16f03ed96913c7a4eb68d6
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL --retry 3 -o app/src/main/assets/model.onnx "$MODEL_URL"
          echo "$MODEL_SHA256  app/src/main/assets/model.onnx" | sha256sum -c -
          ls -la app/src/main/assets/model.onnx

      - name: Check for bundled ONNX model
        run: |
          if [ ! -f app/src/main/assets/model.onnx ]; then
            echo "::warning::model.onnx not found in app/src/main/assets/ — the APK will build, but AI restoration will not work until the model file is bundled."
          else
            echo "model.onnx found — it will be packaged into the APK."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AniRestore-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Stage APKs with versioned names
        if: "github.event_name == 'push' || github.event_name == 'workflow_dispatch'"
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk   "dist/AniRestore-debug-${VER}.apk"
          cp app/build/outputs/apk/release/*.apk "dist/AniRestore-release-unsigned-${VER}.apk"
          echo "== staged release assets =="
          ls -l dist

      - name: Publish GitHub Release (tag pushes)
        if: "startsWith(github.ref, 'refs/tags/')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.apk --clobber
          gh release view "$TAG" --json name,tagName,url

      - name: Publish rolling nightly release (branch pushes & manual runs)
        if: "(github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !startsWith(github.ref, 'refs/tags/')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ -f app/src/main/assets/model.onnx ]; then
            MODEL_NOTE="ONNX model bundled — AI restoration active."
          else
            MODEL_NOTE="No model.onnx bundled — the app builds and installs, but AI restoration stays inactive until a model is added to app/src/main/assets/."
          fi
          # Replace the previous nightly so the tag always points at the newest commit.
          gh release delete nightly --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create nightly \
            --target "$GITHUB_SHA" \
            --title "Nightly ${SHORT_SHA}" \
            --notes "Automated build @ ${GITHUB_SHA} ($(date -u +'%Y-%m-%d %H:%M UTC')). ${MODEL_NOTE}" \
            --prerelease \
            dist/*.apk
          gh release view nightly --json name,tagName,url,assets
