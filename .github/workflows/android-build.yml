name: Build APK

# Builds the Android APK on every push and pull request.
# Debug APK  -> installable directly.
# Release APK -> unsigned; sign it before distribution (see README).
# Tag pushes (v*) additionally publish both APKs to a GitHub Release.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug & release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch ONNX model (Apache-2.0, big-lama)
        # The model is fetched at build time instead of living in git (208 MB
        # binary). Pinned URL + SHA256; swap the pin to upgrade the model.
        env:
          MODEL_URL: https://huggingface.co/gumka/lama-onnx/resolve/main/lama_fp32.onnx
          MODEL_SHA256: 1faef5301d78db7dda502fe59966957ec4b79dd64e16f03ed96913c7a4eb68d6
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL --retry 3 -o app/src/main/assets/model.onnx "$MODEL_URL"
          echo "$MODEL_SHA256  app/src/main/assets/model.onnx" | sha256sum -c -
          ls -la app/src/main/assets/model.onnx

      - name: Check for bundled ONNX model
        run: |
          if [ ! -f app/src/main/assets/model.onnx ]; then
            echo "::warning::model.onnx not found in app/src/main/assets/ — the APK will build, but AI restoration will not work until the model file is bundled."
          else
            echo "model.onnx found — it will be packaged into the APK."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AniRestore-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk \
            --clobber
